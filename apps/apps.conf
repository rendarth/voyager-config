#!/usr/bin/env bash
# ==============================================================================
# voyager-config: standalone app manifest (apps/apps.conf)
#
# Columns (tab separated, no quoting):
#   app           display / logical name (used to derive vendor-repo fn)
#   bins          comma-separated host binaries that prove installation
#   native        distro:pkg[,pkg...] candidates, e.g. pacman:steam,dnf:steam
#   distrobox_pkg AUR package name inside the distrobox Arch container
#   distrobox_bin binary to export to host (empty = skip export)
#   flatpak       Flatpak app ID (Tier 3 fallback)
#   pwa           reserve column (webapp) — empty unless curated later
# ==============================================================================
#
# Provisioning order per app:
#   1. Native — native_available() probe per package manager
#   2. Distrobox — Arch container + yay (AUR)
#   3. Flatpak — Flathub fallback
#   4. pwa: — reserved
# Vendor repositories are applied automatically when a function named
#   repo_<app>_<pkgmgr> exists in lib/vendor-repos.sh.
#
steam	steam	pacman:steam,dnf:steam,zypper:steam					com.valvesoftware.Steam
discord	discord	pacman:discord,dnf:discord	discord	discord	com.discordapp.Discord
obsidian	obsidian	pacman:obsidian	obsidian	obsidian	md.obsidian.Obsidian
bitwarden	bitwarden	pacman:bitwarden	bitwarden	bitwarden	com.bitwarden.desktop
bitwarden-cli	bw	pacman:bitwarden-cli	bitwarden-cli	bw
spotify	spotify	pacman:spotify,apt:spotify-client	spotify	spotify	com.spotify.Client
heroic	heroic	pacman:heroic-games-launcher-bin	heroic-games-launcher-bin	heroic	com.heroicgameslauncher.hgl
brave	brave,brave-browser	pacman:brave-bin,dnf:brave-browser,apt:brave-browser,zypper:brave-browser	brave-bin	brave	com.brave.Browser
zen-browser	zen-browser,zen	pacman:zen-browser-bin,dnf:zen-browser	zen-browser-bin	zen-browser	app.zen_browser.zen
antigravity-cli	agy,antigravity	pacman:antigravity-cli	antigravity-cli	agy
gamescope	gamescope	pacman:gamescope,dnf:gamescope,zypper:gamescope
lazygit	lazygit	pacman:lazygit,dnf:lazygit	lazygit	lazygit
lazydocker	lazydocker	pacman:lazydocker	lazydocker-bin	lazydocker