name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Install shfmt (v3.13.1, matches local)
        run: |
          curl -fsSLo /tmp/shfmt https://github.com/mvdan/sh/releases/download/v3.13.1/shfmt_v3.13.1_linux_amd64
          chmod +x /tmp/shfmt
          sudo mv /tmp/shfmt /usr/local/bin/shfmt
      - name: Setup bats
        run: make setup-test
      - name: Lint
        run: make lint
      - name: Bats (repo-tree, lib-common)
        run: make test

  verify-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Canonical tree assertions
        run: bash scripts/verify/verify-session.sh --repo

  matrix-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Container smoke matrix (debian, ubuntu, arch, fedora, alpine)
        run: bash scripts/test/docker-smoke.sh "$PWD"