name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Setup bats
        run: make setup-test
      - name: Lint
        run: make lint
      - name: Bats (repo-tree, lib-common)
        run: make test

  verify-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Canonical tree assertions
        run: bash scripts/verify/verify-session.sh --repo

  matrix-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [debian:12, ubuntu:24.04, archlinux, fedora:42, alpine:3.21]
    steps:
      - uses: actions/checkout@v4
      - name: Smoke ${{ matrix.image }}
        env:
          SMOKE_IMG: ${{ matrix.image }}
        run: docker run --rm -e SMOKE_IMG -v "$PWD:/repo:ro" "$SMOKE_IMG" bash /repo/scripts/test/docker-smoke-body.sh